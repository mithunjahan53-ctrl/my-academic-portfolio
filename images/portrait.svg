<!--
  PORTRAIT PLACEHOLDER
  --------------------
  Replace this file with your own photo:
    1. Save your photo as images/portrait.jpg (or .png)
    2. Update index.html: <img src="images/portrait.jpg" ...>
  This SVG is only a temporary professional placeholder.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="portraitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e9efe8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d8ded9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="url(#portraitGrad)" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="#8fa68f" stroke-width="4" />
  <!-- Hair -->
  <path d="M 110 140 Q 200 110 290 140 Q 300 160 280 200 Q 260 220 220 220 Q 180 220 160 200 Q 140 160 150 140 Z" fill="#5c4a42" />
  <!-- Face -->
  <ellipse cx="200" cy="220" rx="85" ry="100" fill="#e8dcc5" />
  <!-- Eyes -->
  <circle cx="172" cy="205" r="6" fill="#5c4a42" opacity="0.7" />
  <circle cx="228" cy="205" r="6" fill="#5c4a42" opacity="0.7" />
  <!-- Nose -->
  <path d="M 200 218 Q 200 230 208 232" fill="none" stroke="#c2a88e" stroke-width="3" stroke-linecap="round" />
  <!-- Smile -->
  <path d="M 180 240 Q 200 255 220 240" fill="none" stroke="#c2a88e" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <!-- Initials -->
  <text x="200" y="315" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#7a907a" text-anchor="middle">IJM</text>
  <text x="200" y="355" font-family="Georgia, serif" font-size="16" fill="#7a907a" text-anchor="middle">Portrait Placeholder</text>
</svg>
