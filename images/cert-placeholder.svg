<!--
  CERTIFICATE PLACEHOLDER
  -----------------------
  Replace this file (or add new ones) in images/certificates/ and update
  the <img src="..."> in index.html's CERTIFICATES / SEMINARS sections.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="certGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f1ea;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Page -->
  <rect x="20" y="20" width="360" height="260" rx="12" fill="url(#certGrad)" stroke="#d8ded9" stroke-width="2" />
  <!-- Decorative corner accents -->
  <path d="M 20 20 L 80 20 L 20 80" fill="none" stroke="#8fa68f" stroke-width="3" />
  <path d="M 380 20 L 320 20 L 380 80" fill="none" stroke="#8fa68f" stroke-width="3" />
  <path d="M 20 280 L 80 280 L 20 220" fill="none" stroke="#8fa68f" stroke-width="3" />
  <path d="M 380 280 L 320 280 L 380 220" fill="none" stroke="#8fa68f" stroke-width="3" />
  <!-- Seal -->
  <circle cx="200" cy="200" r="40" fill="none" stroke="#8fa68f" stroke-width="4" />
  <circle cx="200" cy="200" r="32" fill="none" stroke="#8fa68f" stroke-width="2" />
  <text x="200" y="205" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#7a907a" text-anchor="middle">SEAL</text>
  <!-- Placeholder text -->
  <text x="200" y="260" font-family="Georgia, serif" font-size="18" fill="#5b6572" text-anchor="middle">Certificate</text>
  <text x="200" y="282" font-family="Georgia, serif" font-size="13" fill="#8a93a0" text-anchor="middle">Replace with your image</text>
</svg>
